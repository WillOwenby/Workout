<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>LiftLog</title>
  <meta name="description" content="Track workouts, bodyweight and diet every day.">
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LiftLog">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">LiftLog</h1>
    <span id="topbar-extra"></span>
  </header>

  <main id="app" aria-live="polite"></main>

  <div id="rest" class="rest hidden" role="timer" aria-label="Rest timer"></div>
  <div id="toast" class="toast hidden" role="status"></div>

  <nav class="tabbar" id="tabbar" aria-label="Sections">
    <button data-a="tab" data-tab="today"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Today</span></button>
    <button data-a="tab" data-tab="train"><svg viewBox="0 0 24 24"><path d="M2 10h2v4H2zm18 0h2v4h-2zM5 7h3v10H5zm11 0h3v10h-3zM8 11h8v2H8z"/></svg><span>Train</span></button>
    <button data-a="tab" data-tab="diet"><svg viewBox="0 0 24 24"><path d="M7 2v9a3 3 0 0 0 2 2.8V22h2v-8.2A3 3 0 0 0 13 11V2h-1.5v7h-1V2h-1v7h-1V2zm10 0c-2 0-3.5 2.5-3.5 6 0 2.5 1 4 2.5 4.5V22h2V2z"/></svg><span>Diet</span></button>
    <button data-a="tab" data-tab="body"><svg viewBox="0 0 24 24"><path fill-rule="evenodd" d="M4 3h16a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1zm8 3a6 6 0 0 0-5.2 3l2.6 1.5A3 3 0 0 1 12 9c.4 0 .8.1 1.1.2l1.3-2.6A6 6 0 0 0 12 6z"/></svg><span>Body</span></button>
    <button data-a="tab" data-tab="history"><svg viewBox="0 0 24 24"><path d="M3 20h18v2H3zM5 12h3v6H5zm5.5-5h3v11h-3zM16 3h3v15h-3z"/></svg><span>Progress</span></button>
    <button data-a="tab" data-tab="plan"><svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6zm8 1.5V8h4.5zM9 12h8v1.6H9zm0 3.5h8v1.6H9zm0 3.5h5v1.6H9z"/></svg><span>Plan</span></button>
  </nav>

  <script src="foods.js"></script>
  <script src="nutrition.js"></script>
  <script src="app.js"></script>
</body>
</html>
